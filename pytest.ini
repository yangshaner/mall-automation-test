# pytest.ini
[pytest]
minversion = 7.0
testpaths = api/testcases ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --html=reports/test_report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --import-mode=importlib

markers =
    smoke: Smoke testing
    regression: Regression testing
    admin: Backend management test
    member: Front-end user testing
    product: Product management testing
    order: Order Management Testing
    marketing: Marketing Management Test
    home: Homepage configuration test
    file: File service testing
    slow: Slow test
    skip: Skip testing
    security: Security testing
    ui: UI Automation Testing
    e2e: End-to-end testing